apiVersion: apps/v1
kind: Deployment
metadata:
  name: hola-yaml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hola-yaml
  template:
    metadata:
      labels:
        app: hola-yaml
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: nginx
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        volumeMounts:
          - name: cache
            mountPath: /var/cache/nginx
          - name: run
            mountPath: /var/run
        resources:
          limits:
            memory: "128Mi"
            cpu: "250m"
          requests:
            memory: "64Mi"
            cpu: "100m"