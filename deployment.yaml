apiVersion: apps/v1
kind: Deployment
metadata:
  name: hola-yaml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hola-yaml
  template:
    metadata:
      labels:
        app: hola-yaml
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: nginx
        image: nginx
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        resources:
          limits:
            memory: "128Mi"
            cpu: "250m"
          requests:
            memory: "64Mi"
            cpu: "100m"